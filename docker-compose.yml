services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "28502:8501"
    volumes:
      - ./app.py:/app/app.py
      - ./frontend:/app/frontend
      - ./db:/app/db
      - ./indexing:/app/indexing
      - ./llm:/app/llm
      - ./services:/app/services
      - ./tasks:/app/tasks
      - ./utils:/app/utils
      - ./.env:/app/.env
      - files_volume:/app/files
      - local_models_volume:/app/local_models
    env_file: .env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A tasks.process_queue worker --loglevel=info
    volumes:
      - ./app.py:/app/app.py
      - ./frontend:/app/frontend
      - ./db:/app/db
      - ./indexing:/app/indexing
      - ./llm:/app/llm
      - ./services:/app/services
      - ./tasks:/app/tasks
      - ./utils:/app/utils
      - ./.env:/app/.env
      - files_volume:/app/files
      - local_models_volume:/app/local_models
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    env_file: .env
    ports:
      - "25433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "26380:6379"

volumes:
  pgdata:
  files_volume:
  local_models_volume: