services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "28502:8501"
    volumes:
      - files_volume:/app/files
      - streamlit_data:/app/.streamlit
    env_file: .env
    environment:
      - STREAMLIT_CONFIG_DIR=/app/.streamlit
      - XDG_CONFIG_HOME=/app/.config
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A tasks.process_queue worker --loglevel=info
    volumes:
      - files_volume:/app/files
      - streamlit_data:/app/.streamlit
    env_file: .env
    environment:
      - STREAMLIT_CONFIG_DIR=/app/.streamlit
      - XDG_CONFIG_HOME=/app/.config
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    env_file: .env
    ports:
      - "25433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "26380:6379"

volumes:
  pgdata:
  files_volume:
  streamlit_data: