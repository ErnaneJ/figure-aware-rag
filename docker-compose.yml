services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "28502:8501"
    volumes:
      - files_volume:/app/files
    env_file: .env
    environment:
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A tasks.process_queue worker --loglevel=info
    volumes:
      - files_volume:/app/files
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    env_file: .env
    ports:
      - "25433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "26380:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  files_volume:
  ollama_data: